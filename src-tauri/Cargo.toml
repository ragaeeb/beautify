[package]
name = "beautify"
version = "0.2.1"
edition = "2021"
description = "Formats text based on transliteration rules"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.5.1" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-global-shortcut = "2.3.1"
