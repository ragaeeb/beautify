[package]
name = "beautify"
version = "0.2.1"
edition = "2021"
description = "Formats text based on transliteration rules"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.2", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-http = { version = "2.3.2", features = ["default"] }
log = "0.4"
env_logger = "0.11"
